{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
  <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Login to CarePulse</h2>
  <p id="loginError" class="hidden bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-4"></p>
  <form id="loginForm">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" id="email" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" id="password" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <button type="submit" id="loginBtn" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primaryHover transition">Login</button>
  </form>
  <p class="text-center text-sm text-slate-500 mt-4">
    New here? <a href="/signup" class="text-primary font-medium hover:underline">Create an account</a>
  </p>
  <p class="text-center text-xs text-slate-400 mt-6">
    Clinic staff? <a href="/admin/login" class="hover:underline">Admin login</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  function showError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  window.addEventListener('firebase-ready', () => {
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        await signInWithEmailAndPassword(window.firebaseAuth, email, password);
        window.location.href = '/dashboard';
      } catch (err) {
        showError(err.message.replace('Firebase: ', ''));
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  });
</script>
{% endblock %}
