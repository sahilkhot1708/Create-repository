{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
  <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Patient Registration</h2>
  <p id="signupError" class="hidden bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-4"></p>
  <form id="signupForm">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Full Name</label>
      <input type="text" id="name" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" id="email" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Phone</label>
      <input type="tel" id="phone" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" id="password" minlength="6" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
      <p class="text-xs text-slate-400 mt-1">At least 6 characters.</p>
    </div>
    <button type="submit" id="signupBtn" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primaryHover transition">Register Account</button>
  </form>
  <p class="text-center text-sm text-slate-500 mt-4">
    Already registered? <a href="/login" class="text-primary font-medium hover:underline">Login</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
  import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  function showError(msg) {
    const el = document.getElementById('signupError');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  window.addEventListener('firebase-ready', () => {
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const cred = await createUserWithEmailAndPassword(window.firebaseAuth, email, password);
        await updateProfile(cred.user, { displayName: name });

        // Create the patient profile document in Firestore via our API
        const idToken = await cred.user.getIdToken();
        await fetch('/api/patients/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
          body: JSON.stringify({ name, phone })
        });

        window.location.href = '/dashboard';
      } catch (err) {
        showError(err.message.replace('Firebase: ', ''));
        btn.disabled = false;
        btn.textContent = 'Register Account';
      }
    });
  });
</script>
{% endblock %}
