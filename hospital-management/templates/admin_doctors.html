{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-slate-900">Manage Doctors</h1>
    <button onclick="openDoctorModal()" class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:bg-primaryHover">+ Add Doctor</button>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-100 text-slate-700 text-sm">
        <tr>
          <th class="p-4">Name</th>
          <th class="p-4">Specialization</th>
          <th class="p-4">Fee</th>
          <th class="p-4">Rating</th>
          <th class="p-4">Availability</th>
          <th class="p-4">Action</th>
        </tr>
      </thead>
      <tbody id="doctorRows" class="divide-y divide-slate-200 text-sm">
        <tr><td class="p-4 text-slate-400" colspan="6">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add/Edit modal -->
<div id="doctorModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl p-6 w-full max-w-md">
    <h3 class="font-bold text-lg mb-4" id="modalTitle">Add Doctor</h3>
    <p id="modalError" class="hidden bg-red-50 text-red-700 text-sm p-2 rounded-lg mb-3"></p>
    <input type="hidden" id="docId">
    <div class="space-y-3">
      <div>
        <label class="block text-sm font-medium mb-1">Name</label>
        <input type="text" id="docName" class="w-full border border-slate-300 rounded-lg p-2.5" placeholder="Dr. Jane Doe">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Specialization</label>
        <input type="text" id="docSpec" class="w-full border border-slate-300 rounded-lg p-2.5" placeholder="Cardiology">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Fee (₹)</label>
          <input type="number" id="docFee" class="w-full border border-slate-300 rounded-lg p-2.5" placeholder="500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Rating</label>
          <input type="number" step="0.1" min="0" max="5" id="docRating" class="w-full border border-slate-300 rounded-lg p-2.5" placeholder="4.8">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Experience</label>
        <input type="text" id="docExperience" class="w-full border border-slate-300 rounded-lg p-2.5" placeholder="10 yrs">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Availability</label>
        <input type="text" id="docAvailability" class="w-full border border-slate-300 rounded-lg p-2.5" placeholder="Mon-Sat, 10am-5pm">
      </div>
    </div>
    <div class="flex gap-3 mt-6">
      <button onclick="closeDoctorModal()" class="flex-1 border border-slate-300 py-2 rounded-lg">Cancel</button>
      <button onclick="saveDoctor()" id="saveDoctorBtn" class="flex-1 bg-primary text-white py-2 rounded-lg">Save</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let doctors = [];

async function loadDoctors() {
  const res = await fetch('/api/doctors');
  const data = await res.json();
  const tbody = document.getElementById('doctorRows');
  if (!res.ok) {
    tbody.innerHTML = `<tr><td class="p-4 text-red-600" colspan="6">${data.error}</td></tr>`;
    return;
  }
  doctors = data;
  tbody.innerHTML = doctors.length ? doctors.map(d => `
    <tr>
      <td class="p-4 font-medium">${d.name}</td>
      <td class="p-4">${d.specialization}</td>
      <td class="p-4">₹${d.fee}</td>
      <td class="p-4">★ ${d.rating ?? '—'}</td>
      <td class="p-4 text-slate-500">${d.availability || ''}</td>
      <td class="p-4 space-x-3">
        <button onclick='openDoctorModal(${JSON.stringify(d).replace(/'/g, "&#39;")})' class="text-primary hover:underline">Edit</button>
        <button onclick="deleteDoctor('${d.id}')" class="text-red-600 hover:underline">Delete</button>
      </td>
    </tr>
  `).join('') : '<tr><td class="p-4 text-slate-400" colspan="6">No doctors yet. Add one above.</td></tr>';
}
loadDoctors();

function openDoctorModal(doc) {
  document.getElementById('modalError').classList.add('hidden');
  document.getElementById('modalTitle').textContent = doc ? 'Edit Doctor' : 'Add Doctor';
  document.getElementById('docId').value = doc ? doc.id : '';
  document.getElementById('docName').value = doc ? doc.name : '';
  document.getElementById('docSpec').value = doc ? doc.specialization : '';
  document.getElementById('docFee').value = doc ? doc.fee : '';
  document.getElementById('docRating').value = doc ? doc.rating : '';
  document.getElementById('docExperience').value = doc ? doc.experience : '';
  document.getElementById('docAvailability').value = doc ? doc.availability : '';
  document.getElementById('doctorModal').classList.remove('hidden');
}
function closeDoctorModal() {
  document.getElementById('doctorModal').classList.add('hidden');
}

async function saveDoctor() {
  const id = document.getElementById('docId').value;
  const payload = {
    name: document.getElementById('docName').value.trim(),
    specialization: document.getElementById('docSpec').value.trim(),
    fee: Number(document.getElementById('docFee').value) || 0,
    rating: Number(document.getElementById('docRating').value) || 4.5,
    experience: document.getElementById('docExperience').value.trim(),
    availability: document.getElementById('docAvailability').value.trim()
  };
  const errEl = document.getElementById('modalError');
  if (!payload.name || !payload.specialization || !payload.fee) {
    errEl.textContent = 'Name, specialization, and fee are required.';
    errEl.classList.remove('hidden');
    return;
  }
  const btn = document.getElementById('saveDoctorBtn');
  btn.disabled = true;
  try {
    const res = await fetch(id ? `/api/doctors/${id}` : '/api/doctors', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'Save failed');
    closeDoctorModal();
    loadDoctors();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
}

async function deleteDoctor(id) {
  if (!confirm('Remove this doctor? This cannot be undone.')) return;
  const res = await fetch(`/api/doctors/${id}`, { method: 'DELETE' });
  if (res.ok) loadDoctors();
  else alert((await res.json()).error || 'Failed to delete');
}
</script>
{% endblock %}
