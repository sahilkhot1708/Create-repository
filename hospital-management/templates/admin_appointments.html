{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-slate-900 mb-6">Manage All Appointments</h1>

  <div class="mb-4 flex gap-2 flex-wrap">
    <button onclick="setFilter('All')" class="filter-btn px-3 py-1.5 rounded-lg text-sm border border-slate-300" data-f="All">All</button>
    <button onclick="setFilter('Pending')" class="filter-btn px-3 py-1.5 rounded-lg text-sm border border-slate-300" data-f="Pending">Pending</button>
    <button onclick="setFilter('Approved')" class="filter-btn px-3 py-1.5 rounded-lg text-sm border border-slate-300" data-f="Approved">Approved</button>
    <button onclick="setFilter('Completed')" class="filter-btn px-3 py-1.5 rounded-lg text-sm border border-slate-300" data-f="Completed">Completed</button>
    <button onclick="setFilter('Rejected')" class="filter-btn px-3 py-1.5 rounded-lg text-sm border border-slate-300" data-f="Rejected">Rejected</button>
    <button onclick="setFilter('Cancelled')" class="filter-btn px-3 py-1.5 rounded-lg text-sm border border-slate-300" data-f="Cancelled">Cancelled</button>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-100 text-slate-700 text-sm">
        <tr>
          <th class="p-4">Patient</th>
          <th class="p-4">Doctor</th>
          <th class="p-4">Date & Time</th>
          <th class="p-4">Notes</th>
          <th class="p-4">Status</th>
          <th class="p-4">Actions</th>
        </tr>
      </thead>
      <tbody id="apptRows" class="divide-y divide-slate-200 text-sm">
        <tr><td class="p-4 text-slate-400" colspan="6">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allAppts = [];
let currentFilter = 'All';

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('bg-primary', b.dataset.f === f);
    b.classList.toggle('text-white', b.dataset.f === f);
  });
  render();
}

function render() {
  const tbody = document.getElementById('apptRows');
  const filtered = currentFilter === 'All' ? allAppts : allAppts.filter(a => a.status === currentFilter);
  tbody.innerHTML = filtered.length ? filtered.map(a => `
    <tr>
      <td class="p-4 font-medium">${a.patientEmail || 'Unknown'}</td>
      <td class="p-4">${a.doctorName || ''}</td>
      <td class="p-4">${a.date || ''} • ${a.timeSlot || ''}</td>
      <td class="p-4 text-slate-500">${a.notes || '—'}</td>
      <td class="p-4"><span class="status-${a.status} px-2 py-1 rounded text-xs font-semibold">${a.status}</span></td>
      <td class="p-4 space-x-2">
        ${a.status === 'Pending' ? `
          <button onclick="updateStatus('${a.id}','Approved')" class="text-green-600 hover:underline">Approve</button>
          <button onclick="updateStatus('${a.id}','Rejected')" class="text-red-600 hover:underline">Reject</button>` : ''}
        ${a.status === 'Approved' ? `
          <button onclick="updateStatus('${a.id}','Completed')" class="text-blue-600 hover:underline">Mark Completed</button>` : ''}
        ${!['Completed', 'Cancelled'].includes(a.status) ? '' : '—'}
      </td>
    </tr>
  `).join('') : '<tr><td class="p-4 text-slate-400" colspan="6">No appointments in this view.</td></tr>';
}

async function loadAppointments() {
  const res = await fetch('/api/appointments');
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('apptRows').innerHTML = `<tr><td class="p-4 text-red-600" colspan="6">${data.error}</td></tr>`;
    return;
  }
  allAppts = data;
  render();
}
loadAppointments();
setFilter('All');

async function updateStatus(id, status) {
  const res = await fetch(`/api/appointments/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  if (res.ok) loadAppointments();
  else alert((await res.json()).error || 'Update failed');
}
</script>
{% endblock %}
