{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
  <h2 class="text-2xl font-bold text-slate-900 mb-1 text-center">Admin / Doctor Login</h2>
  <p class="text-center text-slate-500 text-sm mb-6">Staff access only</p>
  {% if error %}
  <p class="bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-4">{{ error }}</p>
  {% endif %}
  <form method="POST" action="/admin/login">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Admin Email</label>
      <input type="email" name="email" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold hover:bg-slate-800 transition">Login as Admin</button>
  </form>
  <p class="text-center text-xs text-slate-400 mt-6">
    Set ADMIN_EMAIL / ADMIN_PASSWORD in your .env file.
  </p>
</div>
{% endblock %}
